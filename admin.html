<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard | Bean Bliss Café</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><header class="site-header admin-header"><a class="brand" href="index.html"><span class="brand-mark">☕</span><span>Bean Bliss <small>Admin</small></span></a><div class="header-actions"><a class="btn btn-outline" href="index.html">View Café</a><button class="btn btn-dark" id="adminLogout">Logout</button></div></header>
<main class="admin-shell"><div class="page-title"><span class="eyebrow">Management</span><h1>Admin dashboard</h1><p>Manage the café, orders, menu and offers from one place.</p></div><div id="adminStats" class="stats-grid"></div><div class="admin-grid"><section class="admin-card"><div class="section-head"><div><span class="eyebrow">Menu management</span><h2>Food items</h2></div><button class="btn btn-primary" id="addFoodBtn">+ Add Food</button></div><div id="adminFoods" class="admin-list"></div></section><section class="admin-card"><div class="section-head"><div><span class="eyebrow">Live orders</span><h2>Order management</h2></div></div><div id="adminOrders" class="admin-list"></div></section></div><section class="admin-card"><div class="section-head"><div><span class="eyebrow">Customers</span><h2>Registered customers</h2></div></div><div id="adminCustomers"></div></section></main><div id="adminModal" class="modal hidden"><div class="modal-card"><button class="modal-close" id="adminModalClose">×</button><h2 id="foodModalTitle">Add food</h2><form id="foodForm" class="form-grid"><input type="hidden" id="foodId"><label>Name<input id="foodName" required></label><label>Category<select id="foodCategory"><option>Coffee</option><option>Cold Beverages</option><option>Tea</option><option>Snacks</option><option>Fast Food</option><option>Desserts</option></select></label><label>Price<input id="foodPrice" type="number" min="1" required></label><label>Rating<input id="foodRating" type="number" min="1" max="5" step=".1" value="4.5"></label><label class="full">Description<textarea id="foodDescription" required></textarea></label><label class="check-label"><input id="foodVeg" type="checkbox" checked> Veg</label><label class="check-label"><input id="foodPopular" type="checkbox"> Bestseller</label><button class="btn btn-primary full-btn full" type="submit">Save Food</button></form></div></div><div id="toast"></div><script src="script.js"></script></body></html>
