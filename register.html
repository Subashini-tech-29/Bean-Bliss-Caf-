<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Bean Bliss Café</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body class="auth-page"><div class="auth-wrap"><a class="brand auth-brand" href="index.html"><span class="brand-mark">☕</span><span>Bean Bliss <small>Café</small></span></a><div class="auth-card"><div class="auth-intro"><span class="eyebrow">Join Bean Bliss</span><h1>Create your account.</h1><p>Save favourites, track orders and enjoy a smoother checkout.</p></div><form id="registerForm"><label>Full Name<input id="regName" required placeholder="Your name"></label><label>Email<input id="regEmail" type="email" required placeholder="you@example.com"></label><label>Phone Number<input id="regPhone" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number"></label><label>Password<input id="regPassword" type="password" minlength="6" required placeholder="Minimum 6 characters"></label><label>Confirm Password<input id="regConfirm" type="password" required></label><button class="btn btn-primary full-btn">Create Account →</button></form><p class="auth-switch">Already have an account? <a href="login.html">Login</a></p></div></div><div id="toast"></div><script src="script.js"></script></body></html>
