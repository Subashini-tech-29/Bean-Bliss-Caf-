<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Bean Bliss Café</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">☕</span><span>Bean Bliss <small>Café</small></span></a><div class="header-actions"><a href="cart.html" class="cart-btn">← Cart</a></div></header>
<main class="page-shell"><div class="page-title"><span class="eyebrow">Checkout</span><h1>Almost at bliss.</h1><p>Tell us how you would like to receive your order.</p></div><div class="checkout-layout"><form id="checkoutForm" class="form-card"><h2>Order details</h2><div class="form-grid"><label>Full Name<input id="checkoutName" required></label><label>Phone Number<input id="checkoutPhone" required pattern="[0-9]{10}" maxlength="10"></label><label>Email<input id="checkoutEmail" type="email" required></label><label>Order Type<select id="orderType"><option value="Dine-In">Dine-In</option><option value="Takeaway">Takeaway</option><option value="Delivery">Delivery</option></select></label><label id="tableWrap">Table Number<input id="tableNumber" placeholder="e.g. T-08"></label><label id="addressWrap" class="full">Delivery Address<textarea id="address" rows="3" placeholder="Enter your address"></textarea></label></div><h2>Payment</h2><div class="payment-options"><label><input type="radio" name="payment" value="Pay at Counter" checked> 💵 Pay at Counter</label><label><input type="radio" name="payment" value="UPI"> 📱 UPI (Demo)</label><label><input type="radio" name="payment" value="Card"> 💳 Card (Demo)</label></div><button class="btn btn-primary full-btn" type="submit">Place Order →</button></form><aside id="checkoutSummary" class="summary-card"></aside></div></main><div id="toast"></div><script src="script.js"></script></body></html>
